[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-tui"
version = "0.1.0"
description = "TUI frontend for the GitHub CLI (gh)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nicolás Palacios Díaz" }]
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/njpd57/gh-tui"

[project.scripts]
ghtui = "ghtui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
